name: Release

# Pushing a tag like v0.2.0 verifies the course and publishes a GitHub
# release whose notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify the course before releasing
        run: cargo rusty dev verify
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${TAG#v}" '
            /^## / { if (found) exit; if (index($0, "[" version "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $TAG"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
