# Predict-the-output questions. The runner compiles and runs each snippet;
# the right choice is whichever matches what actually happens. Special
# choices: "does not compile", "panics", "runs forever", "compiles".

[[question]]
prompt = "What does this print?"
code = '''
fn main() {
    let v = vec![1, 2, 3];
    let doubled = v.iter().map(|x| {
        print!("{x} ");
        x * 2
    });
    print!("start ");
    let total: i32 = doubled.sum();
    println!("= {total}");
}
'''
choices = ["1 2 3 start = 12", "start 1 2 3 = 12", "start = 12"]
explain = """
Adaptors are lazy: `map` only stores the closure. Nothing runs until a
consumer pulls items through, here `sum`, so "start" comes first. This is
also why side effects inside `map` are a smell: when (and whether) they
happen depends on who consumes the iterator, and how far.
"""
drill = "06-iterators/02_lazy"

[[question]]
prompt = "What does this print?"
code = '''
fn main() {
    let odd = (1..=3)
        .map(|x| {
            print!("m{x} ");
            x
        })
        .filter(|x| {
            print!("f{x} ");
            x % 2 == 1
        })
        .count();
    println!("-> {odd}");
}
'''
choices = [
    "m1 m2 m3 f1 f2 f3 -> 2",
    "m1 f1 m2 f2 m3 f3 -> 2",
    "-> 2",
]
explain = """
An iterator chain is not a series of passes over the data. Each item travels
through the whole chain before the next one starts, so no intermediate
collection is ever built. If you see "m1 m2 m3", someone collected in the
middle.
"""

[[question]]
prompt = "What does this print?"
code = '''
fn main() {
    let mut it = [1, 2, 3, 4, 5].into_iter();
    let small: Vec<i32> = it.by_ref().take_while(|&x| x < 3).collect();
    let rest: Vec<i32> = it.collect();
    println!("{small:?} {rest:?}");
}
'''
choices = [
    "[1, 2] [3, 4, 5]",
    "[1, 2] [4, 5]",
    "[1, 2] []",
    "does not compile",
]
explain = """
`take_while` can only find out that 3 fails by taking it from the
underlying iterator, and then it has nowhere to put it back: the 3 is lost.
`by_ref()` lets you keep using `it` afterwards, which is what exposes the
loss. When the boundary item matters, use `peekable()` and
`while let Some(x) = it.next_if(|&x| x < 3)`.
"""
drill = "06-iterators/06_custom_iterator"

[[question]]
prompt = "What happens?"
code = '''
fn main() {
    for (i, c) in "abc".chars().enumerate().rev() {
        print!("{i}{c} ");
    }
    println!();
}
'''
choices = ["0c 1b 2a", "2c 1b 0a", "does not compile"]
explain = """
E0277: `Enumerate` is only double-ended when the inner iterator is also an
`ExactSizeIterator`, because numbering from the back needs the length.
`Chars` can't know how many characters it holds without decoding the UTF-8.
On a slice, `.iter().enumerate().rev()` works and keeps the original
indices (2c 1b 0a); `.chars().rev().enumerate()` numbers the reversed
sequence (0c 1b 2a).
"""
drill = "06-iterators/06_custom_iterator"

[[question]]
prompt = "What does this print?"
code = '''
fn main() {
    let words = ["bb", "a", "cc", "d"];
    let longest = words.iter().max_by_key(|w| w.len()).unwrap();
    let shortest = words.iter().min_by_key(|w| w.len()).unwrap();
    println!("{longest} {shortest}");
}
'''
choices = ["bb a", "cc a", "bb d", "cc d"]
explain = """
On ties, `max_by_key` and `max_by` return the *last* maximum, while
`min_by_key` and `min_by` return the *first* minimum. That keeps them
consistent with a stable sort: sort ascending, and `min` is the first
element, `max` the last. To get the first of several maxima, search
`.rev()`.
"""
drill = "06-iterators/05_sort_and_search"

[[question]]
prompt = "What happens?"
code = '''
fn main() {
    let temps = [21.5, 19.0, 23.25];
    let hottest = temps.iter().max();
    println!("{hottest:?}");
}
'''
choices = ["Some(23.25)", "23.25", "does not compile"]
explain = """
E0277: `max` needs `Ord`, and `f64` is only `PartialOrd`, because NaN isn't
less than, equal to, or greater than anything. The same goes for `sort` and
for `*_by_key` with a float key. Use `max_by(|a, b| a.total_cmp(b))`, or
`.copied().fold(f64::NEG_INFINITY, f64::max)`.
"""
drill = "06-iterators/05_sort_and_search"

[[question]]
prompt = "Does this compile (edition 2024)?"
code = '''
struct Shelf {
    books: Vec<String>,
}

impl Shelf {
    fn lengths(&self) -> impl Iterator<Item = usize> {
        self.books.iter().map(|b| b.len())
    }
}

fn main() {
    let shelf = Shelf {
        books: vec!["Dune".to_string(), "Emma".to_string()],
    };
    println!("{}", shelf.lengths().sum::<usize>());
}
'''
choices = ["compiles", "does not compile"]
explain = """
The returned iterator borrows `self.books`, and nothing in
`impl Iterator<Item = usize>` mentions that borrow. In edition 2021 that was
E0700 and you had to write `+ '_`. Since edition 2024, return-position
`impl Trait` captures every lifetime in scope. To capture *less*, list what
it may use: `+ use<>` (Rust 1.82).
"""
drill = "06-iterators/07_into_iterator"

[[question]]
prompt = "What does this print?"
code = '''
use std::collections::HashMap;

fn main() {
    let scores: HashMap<&str, u32> = [("ana", 70), ("ben", 50), ("ana", 90)]
        .into_iter()
        .collect();
    println!("{} {}", scores["ana"], scores.len());
}
'''
choices = ["70 2", "90 2", "90 3", "panics"]
explain = """
Collecting pairs into a map inserts them in order, and a repeated key
overwrites the earlier value: the last one wins, with no error. Feed it
records in time order and you get "latest per key" for free. To keep
every value, group with the entry API instead.
"""
drill = "06-iterators/08_collect"

[[question]]
prompt = "What does this print?"
code = '''
use std::cmp::Reverse;
use std::collections::BinaryHeap;

fn main() {
    let mut heap = BinaryHeap::new();
    for x in [3, 1, 4, 1, 5] {
        heap.push(Reverse(x));
    }
    heap.pop();
    while let Some(Reverse(x)) = heap.pop() {
        print!("{x}");
    }
    println!();
}
'''
choices = ["1345", "5431", "345", "3145"]
explain = """
`BinaryHeap` is a max-heap, and `Reverse` flips the ordering, so the
*smallest* number pops first: the first `pop` removes one of the 1s, and the
rest come out 1, 3, 4, 5. A heap keeps duplicates. Only `peek`, `pop` and
`into_sorted_vec` respect the order: iterating a heap directly visits its
internal layout.
"""
drill = "06-iterators/09_collections"

[[question]]
prompt = "What happens?"
code = '''
use std::iter;

fn main() {
    let powers: Vec<u8> = iter::successors(Some(1u8), |&x| x.checked_mul(4)).collect();
    println!("{powers:?}");
}
'''
choices = ["[1, 4, 16, 64]", "[1, 4, 16, 64, 0]", "panics", "runs forever"]
explain = """
`successors` yields its first item, then keeps calling the closure on the
previous one until it returns `None`. `64 * 4` doesn't fit in a `u8`, so
`checked_mul` returns `None` and the sequence ends there: no overflow, no
wrap to 0. With a plain `x * 4` it would panic in a debug build.
"""
drill = "06-iterators/06_custom_iterator"
